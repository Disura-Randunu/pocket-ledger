<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Pocket Ledger</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Safety net: if the app never draws (for example a cached page pointing at files that are gone),
      // drop the cached copy and load fresh once. Data lives in IndexedDB, which this does not touch.
      setTimeout(function () {
        if (document.getElementById('app').firstChild || sessionStorage.getItem('retried') || !self.caches) return;
        sessionStorage.setItem('retried', '1');
        caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
          .then(function () { location.reload(); });
      }, 4000);
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
